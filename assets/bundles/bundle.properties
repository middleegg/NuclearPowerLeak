ui.nu.frog.profile.title = Mod Introduction
ui.nu.frog.profile.label.description = This Mod originated from a thing Zero did out of boredom right after the high school entrance exam. It was originally a JSON Mod.\nZero finally decided to release the first version a year later — and that would be the only JSON version. All future releases will be Java-based.
ui.nu.frog.profile.label.content = Azeroth, Twilight planet — it is said that the old Federation originated from here. Sadly, under the devastation of Four Great Disasters\nthis planet no longer shines with its former vitality. Barren and ruined. Until, an interstellar traveler accidentally arrived here.
ui.nu.frog.profile.label.name = Nuclear Power Leak
ui.nu.frog.profile.value.weight = As for why there's only one update a year? Basically laziness. This wild-author is unbelievably lazy — terminal-level couch potato.
ui.nu.frog.profile.btn.back = Back ←
ui.nu.frog.profile.btn.close = Close
