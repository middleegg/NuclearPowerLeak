# ===== Item names (Key convention: item.<modId>-<itemId>.name)
# Original English translation note: Some names are kept as transliterated industrial terms for consistency with the Mod's setting
item.nu-bigIron.name = Pig Iron
item.nu-bigIron.details = Ever since that disaster, nothing was spared — including these minerals. They turned from silvery iron into this state. Sigh, the Federation...
item.nu-bigIron.description = But at least they're still usable. Let's gather them first.
item.nu-Tcoal.name = T-type Coal
item.nu-Tcoal.description = Under the influence of radiation, it actually gained higher fuel value. Only its shape is a bit disappointing.
item.nu-sulFurFrag.name = Sulfur Core
item.nu-sulFurFrag.description = Surface-exposed sulfur ore deposit.
item.nu-monoSiliCrystal.name = Monocrystal
item.nu-monoSiliCrystal.description = Basic resource. Edible, but doesn't taste good.
item.nu-magent.name = Magnet
item.nu-magent.descrpition = Purified iron with inherent magnetic properties.
item.nu-frailPolyester.name = Fragile Polyester
item.nu-frailPolyester.descrpition = Dusk and loneliness — the organic materials the Federation once took pride in have long been corroded by radiation, their structural strength completely degraded.
item.nu-pumice.name = Pumice Stone
item.nu-pumice.descrpition = Even these calcium salts didn't escape? That's truly terrifying... Hiss, seems like there's also some silver content — actually not bad material.
item.nu-oriRubber.name = Raw Rubber
item.nu-oriRubber.description = Mineral raw material harvested from dead vegetation.
item.nu-rubberFrag.name = Rubber Seed
item.nu-rubberFrag.description = Rubber seeds cultivated inside a seed harvester.
item.nu-alkSliver.name = Alkaline Silver
item.nu-alkSliver.descrpition = Alkaline-processed silver metal.
item.nu-rubber.name = Rubber
item.nu-rubber.descrpition = The cornerstone of basic industry.
item.nu-uranCrystal.name = Uranium Crystal
item.nu-uranCrystal.description = A dazzling emerald shining among innumerable Qinluns. When the disaster faded, only the scarred earth remained.
item.nu-oriUranium.name = Crude Uranium
item.nu-oriUranium.descrpition = The very origin of the catastrophe.
item.nu-thallide.name = Thallide Compound
item.nu-thallide.description = Extremely toxic. Artificially sealed within this tiny crystal is the Second Calamity — which has never arrived.
item.nu-uranium.name = Uranium
item.nu-uranium.descrpition = The beginning of all calamities. Also known as the First Disaster.
item.nu-bottledMagenticStorm.name = Bottled Magnetic Storm
item.nu-bottledMagenticStorm.descrpition = The Third Calamity. The very existence of this thing resembles a 21-gun salute at the funeral of the Human Federation.

# ===== Liquids (Mod>
liquid.nu-dirtySolution.name = Filth
#(industrial wastewater
liquid.nu-dirtySolution.descrpition = Nothing to do with the Calamity. This is plain industrial wastewater discharged from factories. Ironically, the filth that was once universally hated by the Federation now feels oddly familiar compared to those horrors of the Calamity. Collect it — we may be able to extract rare metals from it.
liquid.nu-liquidOxygen.name = Liquid Oxygen
liquid.nu-liquidOxygen.descrpition = Liquid oxygen exhibits extremely strong heat absorption, which is why it is used as a natural coolant, cryogen, and accelerator.
liquid.nu-nuclearFluid.name = Nuclear Fluid
liquid.nu-nuclearFluid.descrpition = The avatar of the First Disaster — a curse that descended upon this land.
liquid.nu-strangeLiquid.name = Strange Liquid
liquid.nu-strangeLiquid.descrpition = Originally specialized coolant supply for nuclear reactors has, now leaked became a common household chemical fluid everywhere.
planet.nu-Azer.name=Azer
