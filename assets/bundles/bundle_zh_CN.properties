liquid.nu-dirtySolution.name=污秽
liquid.nu-dirtySolution.descrpition=与灾厄无关，这些是工厂排放的工业废水，不过很好笑/n曾经在联邦人人厌恶的污秽比起那些灾厄，还真是感觉亲近/n收集起来吧，我们或许可以从里面获得稀有金属。
liquid.nu-liquidOxygen.name=液氧
liquid.nu-liquidOxygen.descrpition=液态氧气具有极强的吸热性，所以会被当成天然的降温剂，冷却剂，加速剂
liquid.nu-nuclearFluid.name=核废液
liquid.nu-nuclearFluid.descrpition=第一灾厄的化身，降临于这片大地的诅咒。
liquid.nu-strangeLiquid.name=奇液
liquid.nu-strangeLiquid.descrpition=原先属于供应核反应堆的专门冷却液，如今随着泄露，也一并变成了随处可见的家用化工液
planet.nu-Azer.name=阿泽厄尔
