# ===== 单位名称（键名 = unit.<modId>-<itemId>.name）
unit.nu-arcnelidia.name = 电弧虫
unit.nu-arcnelidia.description = 带有电弧激光武器的多节飞行单位，由头部和9节段身组成
unit.nu-arcnelidia.details = [gray]多节飞行单位，800血量，速度4，护甲5。由头部和9节段身组成。头部装备电弧激光武器，段身投弹（造成范围伤害）。直线冲向目标越过折返。轻微晃动。每秒回复10血。[]

unit.nu-toxobyte.name = 毒疫虫
unit.nu-toxobyte.description = 携带瘟疫炮弹和吸附激光的多节飞行单位，由头部和25节段身组成，能够再生新段身
unit.nu-toxobyte.details = [gray]多节飞行单位，200血量，速度3。由头部和25节段身组成。头部发射12发散射吸附激光（自动回血），段身投掷瘟疫炮弹（造成范围伤害）。环绕目标飞行。每6秒再生一节段身（最多25节）。可分裂（段身死亡时虫子分裂）和链式合并（两条靠近时合并）。每秒回复15血。[]
# =======================
# 墙类方块（能量护盾墙 + 磁力墙）
# 键名约定：block.<modId>-<blockId>.{name|description}
# =======================
block.nu-energyStorageWall.name=储能墙
block.nu-energyStorageWall.description=内嵌电池单元的墙体。\n[accent]双向电力[]：consumePowerBuffered 自动储电，邻接电池/发电机/电力节点即自动组网共享电力，无需电力节点逐个串联。\n[accent]死亡复活[]：血量归零时消耗储电回血并释放一次冲击波。\n[accent]满电自愈[]：储电满时按一定速度持续回血。
block.nu-energyStorageLargeWall.name=大型储能墙
block.nu-energyStorageLargeWall.description=储能墙的 2x2 版本。容量更大，冲击波更强，回血速度更高。
block.nu-magneticPullWall.name=磁力墙
block.nu-magneticPullWall.description=镶嵌磁力线圈防御墙。\n被子弹命中时有概率触发磁力脉冲，在短时间内持续把周围的敌方地面单位拉向墙体并附加减速。\n飞行单位免疫。
block.nu-magneticPullLargeWall.name=大型磁力墙
block.nu-magneticPullLargeWall.description=磁力墙的 2x2 版本。触发概率更高，吸引半径更大，持续时间更长。
